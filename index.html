<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#10141f" />
    <title>TankSpeed — tank kart racing on Nostr</title>
    <meta name="description" content="Mario-Kart-style racing with tanks. Drop bananas, fire shells, race your friends on Nostr." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Lobby: shown until the race starts. Mobile-first single column. -->
    <div id="lobby" class="panel">
      <h1>TANK<span>SPEED</span></h1>
      <p class="tag">Kart racing with tanks. Drop bananas. Fire shells.</p>
      <div class="field">
        <span>Racer</span>
        <div id="who" class="who">
          <input id="name" maxlength="16" placeholder="anon" autocomplete="off" />
          <button id="login" title="Login with a NIP-07 extension">LOGIN</button>
        </div>
        <div id="whoami" class="whoami" hidden></div>
      </div>
      <div class="field">
        <span>Track</span>
        <div id="maps" class="row"></div>
      </div>
      <button id="start" class="big">RACE</button>
      <button id="garage-open" class="linky">🛠 garage — pick your skin</button>
      <p class="hint">Drive: WASD / arrows · item: space · Mobile: auto-gas, steer with the pads, tap the item button.</p>
    </div>

    <!-- Garage: skin picker over a live tank preview. -->
    <div id="garage" class="sheet" hidden>
      <div class="field">
        <span>Pattern</span>
        <div id="patterns" class="row wrap"></div>
      </div>
      <div class="field">
        <span>Finish</span>
        <div id="finishes" class="row wrap"></div>
      </div>
      <p id="skin-blurb" class="hint"></p>
      <button id="garage-done" class="big">DONE</button>
    </div>

    <!-- HUD -->
    <div id="hud" hidden>
      <div id="place">1<sup>st</sup></div>
      <div id="lap">LAP 1/3</div>
      <div id="timer">0:00.0</div>
      <div id="item" class="empty"></div>
    </div>

    <div id="countdown" hidden></div>
    <div id="toast" hidden></div>

    <!-- Results -->
    <div id="results" class="panel" hidden>
      <h2 id="results-title">FINISH</h2>
      <ol id="standings"></ol>
      <button id="again" class="big">RACE AGAIN</button>
      <button id="menu" class="linky">change track</button>
    </div>

    <!-- Touch controls: only visible on coarse pointers (see CSS). -->
    <div id="touch">
      <div id="steer-l" class="pad">◀</div>
      <div id="steer-r" class="pad">▶</div>
      <div id="use-item" class="pad item-pad">🎁</div>
      <div id="brake" class="pad brake-pad">▼</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
